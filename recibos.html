<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABR — Recibos em espécie</title><style>
*{box-sizing:border-box}body{margin:0;font:12px Arial,sans-serif;color:#222;background:#eee}.toolbar{padding:16px;text-align:center;background:#222;color:white;position:sticky;top:0}.toolbar button,.toolbar select{font:inherit;padding:10px;margin:4px}.sheet{width:190mm;margin:10px auto;background:white}.receipt{height:69mm;padding:3mm 5mm;border-bottom:1px dashed #aaa;display:flex;flex-direction:column;gap:2mm}.receipt:last-child{border-bottom:0}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid #b71925;padding-bottom:1.5mm}.brand{font-size:26px;font-weight:900;color:#b71925;line-height:1}.brand small{display:block;font-size:8px;letter-spacing:3px;color:#222}.heading{text-align:right;font-size:15px;font-weight:bold}.heading small{display:block;font-size:10px;color:#555;font-weight:normal}.field{display:flex;align-items:baseline;gap:3mm}.line{flex:1;border-bottom:1px solid #555;height:4mm}.value{display:flex;align-items:center;gap:3mm;border:1px solid #aaa;border-radius:2mm;padding:2mm 3mm;font-weight:bold}.value .line{max-width:65mm}.value span:first-child{margin-right:auto}.dates{display:flex;gap:10mm}.dates>div{flex:1}.date{display:flex;gap:2mm;align-items:baseline;margin-top:1mm}.date i{width:12mm;height:4mm;border-bottom:1px solid #555}.date i:last-child{width:23mm}.declaration{font-size:11px;margin:0;line-height:1.3}.signature{margin:auto auto 0;width:70%;border-top:1px solid #555;text-align:center;padding-top:1mm;font-size:10px}@page{size:A4 portrait;margin:10mm}@media print{body{background:white}.toolbar{display:none}.sheet{margin:0;width:100%;break-after:page}.sheet:last-child{break-after:auto}.receipt{break-inside:avoid;height:69mm}}@media screen and (max-width:740px){.sheet{width:100%;min-width:340px}.receipt{padding:3mm}.dates{gap:3mm}.date i{width:8mm}.date i:last-child{width:15mm}}
</style></head><body><div class="toolbar"><label>Folhas A4: <select id="pages"><option value="1">1 — 4 recibos</option><option value="2">2 — 8 recibos</option><option value="3">3 — 12 recibos</option><option value="4">4 — 16 recibos</option><option value="5" selected>5 — 20 recibos</option></select></label><button id="print">Imprimir / Salvar PDF</button></div><main id="sheets"></main><template id="receipt"><article class="receipt"><header><div class="brand">ABR<small>AÇOUGUE</small></div><div class="heading">RECIBO DE PAGAMENTO<small>EM ESPÉCIE</small></div></header><div class="field"><b>Fornecedor:</b><span class="line"></span></div><div class="value"><span>VALOR RECEBIDO</span><span>R$</span><span class="line"></span></div><div class="field"><b>Referente a:</b><span class="line"></span></div><div class="dates"><div><b>Data da compra</b><div class="date"><i></i>/<i></i>/<i></i></div></div><div><b>Data do pagamento</b><div class="date"><i></i>/<i></i>/<i></i></div></div></div><p class="declaration">Declaro ter recebido do Açougue ABR o valor acima, em espécie, referente ao pagamento da mercadoria identificada neste recibo.</p><div class="signature">Assinatura do fornecedor</div></article></template><script>const pages=document.getElementById('pages'),root=document.getElementById('sheets'),tpl=document.getElementById('receipt');function render(){root.replaceChildren();for(let i=0;i<Number(pages.value);i++){const sheet=document.createElement('section');sheet.className='sheet';for(let j=0;j<4;j++)sheet.append(tpl.content.cloneNode(true));root.append(sheet)}}pages.onchange=render;document.getElementById('print').onclick=()=>window.print();render();</script></body></html>
